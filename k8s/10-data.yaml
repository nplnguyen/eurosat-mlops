# Briques d'état (simplifiées pour le projet : en production on utiliserait
# des services managés type RDS / ElastiCache / S3).
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: eurosat}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: postgres}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: eurosat-secrets, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data, subPath: pgdata}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres"]}
      volumes:
        - name: init
          configMap: {name: postgres-init}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: eurosat}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: eurosat}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{containerPort: 6379}]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 300Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: eurosat}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mlflow, namespace: eurosat}
spec:
  replicas: 1
  selector: {matchLabels: {app: mlflow}}
  template:
    metadata: {labels: {app: mlflow}}
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/OWNER/eurosat-mlflow:latest
          env:
            - {name: MLFLOW_BACKEND_STORE_URI, value: "postgresql://mlflow:mlflow@postgres:5432/mlflow"}
            # Remplacer par un vrai bucket S3 + identifiants AWS via Secret
            - {name: MLFLOW_ARTIFACTS_DESTINATION, value: "s3://eurosat-mlflow/artifacts"}
          ports: [{containerPort: 5000}]
          readinessProbe:
            httpGet: {path: /health, port: 5000}
---
apiVersion: v1
kind: Service
metadata: {name: mlflow, namespace: eurosat}
spec:
  selector: {app: mlflow}
  ports: [{port: 5000}]
