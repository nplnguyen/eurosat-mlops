name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - name: Dépendances
        run: |
          pip install -r api/requirements.txt
          pip install pytest httpx onnx==1.17.0 ruff
      - name: Lint (ruff)
        run: ruff check api training tests scripts loadtest ui
      - name: Tests
        run: pytest -q --junitxml=reports/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: test-report, path: reports/}

  validate-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt / validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
      - name: kustomize build
        run: kubectl kustomize k8s > /dev/null

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    strategy:
      matrix:
        image: [api, ui, training, mlflow]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
