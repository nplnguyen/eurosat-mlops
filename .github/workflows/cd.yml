name: CD

# Déploiement continu : chaque tag vX.Y.Z (ou un lancement manuel) construit
# les images, les pousse sur GHCR puis met à jour la VM de production.
#
# Secrets GitHub nécessaires :
#   VM_HOST      IP / DNS de la VM (sortie Terraform `public_ip`)
#   VM_USER      utilisateur SSH (ubuntu)
#   VM_SSH_KEY   clé privée SSH de déploiement
#   PROD_ENV     contenu complet du fichier .env de production
#   SMOKE_API_KEY clé d'API dédiée au smoke test

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  push-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: eurosat-api, dockerfile: api/Dockerfile}
          - {name: eurosat-ui, dockerfile: ui/Dockerfile}
          - {name: eurosat-trainer, dockerfile: training/Dockerfile}
          - {name: eurosat-mlflow, dockerfile: mlflow/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    runs-on: ubuntu-latest
    needs: push-images
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Préparer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n' > ~/.ssh/config
      - name: Écrire le .env de production
        run: |
          echo "${{ secrets.PROD_ENV }}" > .env.prod
          sed -i "s|^REGISTRY=.*|REGISTRY=${REGISTRY}|" .env.prod
      - name: Login GHCR sur la VM (images privées)
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin"
      - name: Déploiement
        run: ./scripts/deploy.sh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} ${{ github.ref_name }}
      - name: Smoke test authentifié
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://${{ secrets.VM_HOST }}/api/v1/model)
          test "$code" = "401" || { echo "La route devrait exiger une clé (reçu $code)"; exit 1; }
          curl -fs -H "X-API-Key: ${{ secrets.SMOKE_API_KEY }}" http://${{ secrets.VM_HOST }}/api/v1/model
