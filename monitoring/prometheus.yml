global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Découverte DNS : chaque réplica (docker compose --scale) est scrapé.
  - job_name: api-stable
    metrics_path: /metrics/
    dns_sd_configs:
      - names: [api-stable]
        type: A
        port: 8000
  - job_name: api-canary
    metrics_path: /metrics/
    dns_sd_configs:
      - names: [api-canary]
        type: A
        port: 8000
